# ZRAM Generator Configuration
# /etc/systemd/zram-generator.conf
#
# Этот файл настраивает ZRAM (сжатую RAM подкачку)
# Документация: man zram-generator

[zram0]
# Размер ZRAM устройства
# Варианты:
#   min(ram * 0.6, 4096)  # 60% RAM или максимум 4GB (рекомендуется)
#   ram * 0.5             # 50% RAM
#   2048                  # Фиксированный размер 2GB
#   none                  # Отключено
zram-size = min(ram * 0.6, 4096)

# Алгоритм сжатия
# Варианты: zstd (рекомендуется), lz4, lzo, lz4hc
compression-algorithm = zstd

# Тип использования
# swap — для подкачки (рекомендуется)
# ext4 — для файловой системы
fs-type = swap

# Точка монтирования (только для fs-type != swap)
# mount-point = /var/compressed
