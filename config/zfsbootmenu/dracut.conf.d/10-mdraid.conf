# Intel RST / mdadm RAID (imsm metadata) support for ZFSBootMenu
#
# Installed to /etc/zfsbootmenu/dracut.conf.d/ by zbm_setup.py --mdraid.
# Needed for 2x NVMe RAID 0 volumes created in the Intel RST firmware, which
# Linux sees as an imsm container (e.g. /dev/md127) plus the RAID volume
# (e.g. /dev/md126, /dev/md/Volume0_0).
#
# Notes:
#  - "imsm" and "ddf" are mdadm metadata formats, NOT kernel modules. Listing
#    them in add_drivers/force_drivers makes dracut fail, so they are not here.
#  - The dracut module is "mdraid" and it is added with add_dracutmodules
#    ("add_modules" is not a dracut option and is silently ignored).
#  - mdraid only assembles arrays when the kernel command line contains
#    rd.auto=1 (or rd.md.uuid=...). zbm_setup.py puts rd.auto=1 into
#    Kernel.CommandLine in /etc/zfsbootmenu/config.yaml.

# mdadm, mdmon and the md udev rules
add_dracutmodules+=" mdraid "

# Include /etc/mdadm/mdadm.conf (not done automatically with hostonly=no)
mdadmconf="yes"

# vmd    - Intel Volume Management Device; RST NVMe drives sit behind it on
#          11th gen+ platforms, without it the NVMe disks are invisible
# md_mod - md core, raid0 - personality used by RST RAID 0 volumes
force_drivers+=" vmd md_mod raid0 "
add_drivers+=" nvme ahci raid1 raid10 "

# Hooks (early-setup.d/10-mdraid-assemble.sh assembles the array before
# ZFSBootMenu imports pools)
zfsbootmenu_hook_root="/etc/zfsbootmenu/hooks"
